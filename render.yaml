services:
  - type: web
    name: xunji-museum-guide
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -B backend/main.py"
    healthCheckPath: /health
    envVars:
      - key: LUMORA_HOST
        value: 0.0.0.0
      - key: LUMORA_LLM_API_KEY
        sync: false
